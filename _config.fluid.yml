# Fluid 主题覆盖配置
# 只写需要改的项，其余沿用 node_modules/hexo-theme-fluid/_config.yml

favicon: /img/favicon.png
apple_touch_icon: /img/favicon.png
tab_title_separator: " · "

dark_mode:
  enable: true
  default: dark

color:
  body_bg_color: "#f5f6fa"
  body_bg_color_dark: "#08080c"

  navbar_bg_color: "#08080c"
  navbar_bg_color_dark: "#08080c"

  navbar_text_color: "#e7e7ef"
  navbar_text_color_dark: "#e7e7ef"

  subtitle_color: "#ffffff"
  subtitle_color_dark: "#f5f3ff"

  text_color: "#1f2430"
  text_color_dark: "#e7e7ef"

  sec_text_color: "#6b7280"
  sec_text_color_dark: "#a1a1aa"

  board_color: "#ffffff"
  board_color_dark: "#111118"

  post_text_color: "#1f2430"
  post_text_color_dark: "#d8d8e4"

  post_heading_color: "#111827"
  post_heading_color_dark: "#f5f3ff"

  post_link_color: "#7c3aed"
  post_link_color_dark: "#a78bfa"

  link_hover_color: "#8b5cf6"
  link_hover_color_dark: "#c4b5fd"

  link_hover_bg_color: "#f5f3ff"
  link_hover_bg_color_dark: "#1b1730"

  line_color: "#e5e7eb"
  line_color_dark: "#26263a"

  scrollbar_color: "#c4c6c9"
  scrollbar_color_dark: "#4c4c63"

  scrollbar_hover_color: "#a6a6a6"
  scrollbar_hover_color_dark: "#6d6d8a"

  button_bg_color: "transparent"
  button_bg_color_dark: "transparent"

  button_hover_bg_color: "#f5f3ff"
  button_hover_bg_color_dark: "#1b1730"

font:
  font_size: 16px
  font_family: '"Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif'
  letter_spacing: 0.02em
  code_font_size: 85%

fun_features:
  typing:
    enable: true
    typeSpeed: 80
    cursorChar: "_"
    loop: false
    scope: [home]
  anchorjs:
    enable: true
    element: h1,h2,h3,h4,h5,h6
    placement: left
    visible: hover
    icon: ""
  progressbar:
    enable: true
    height_px: 3
    color: "#8b5cf6"

navbar:
  blog_title: "ALIST"
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "tag", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }

search:
  enable: true
  path: /local-search.xml
  generate_path: /local-search.xml
  field: post
  content: true

banner:
  random_img: false
  parallax: true
  width_height_ratio: 1.0

scroll_down_arrow:
  enable: true
  banner_height_limit: 80
  scroll_arrow_float: true

index:
  banner_img: /img/banner.webp
  banner_img_height: 100
  banner_mask_alpha: 0.45
  slogan:
    enable: true
    text: "无限进步"
  auto_excerpt:
    enable: true
  post_url_target: _self

post:
  banner_img: /img/banner.webp
  banner_img_height: 70
  banner_mask_alpha: 0.5
  meta:
    author:
      enable: false
    date:
      enable: true
      format: "YYYY-MM-DD"
    wordcount:
      enable: true
    min2read:
      enable: true
      awl: 2
      wpm: 60

archive:
  banner_img: /img/banner.webp
  banner_img_height: 55
  banner_mask_alpha: 0.55

category:
  banner_img: /img/banner.webp
  banner_img_height: 55
  banner_mask_alpha: 0.55

tag:
  banner_img: /img/banner.webp
  banner_img_height: 55
  banner_mask_alpha: 0.55

page:
  banner_img: /img/banner.webp
  banner_img_height: 55
  banner_mask_alpha: 0.55

about:
  enable: true
  banner_img: /img/banner.webp
  banner_img_height: 55
  banner_mask_alpha: 0.55
  avatar: /img/avatar.jpg
  name: "LI_SparrowC1"
  intro: "写点小工具，也做点好玩的东西。"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/LISparrowC1", tip: "GitHub" }

code:
  copy_btn: true
  language:
    enable: true
    default: "TEXT"
  highlight:
    enable: true
    line_number: false
    lib: "highlightjs"
    highlightjs:
      style: "github"
      style_dark: "atom-one-dark"

footer:
  content: |
    <span>© 2026 LI_SparrowC1</span>
    <span class="footer-sep">·</span>
    <a href="https://hexo.io" target="_blank" rel="noopener"><span>Hexo</span></a>
    <i class="iconfont icon-love"></i>
    <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank" rel="noopener"><span>Fluid</span></a>
  statistics:
    enable: false
  beian:
    enable: false

custom_css:
  - /css/custom.css

custom_js:
  - /js/loading.js
  - /js/snow-effect.js
  - /js/mouse-trail.js
  - /js/click-hearts.js
  - /js/title-effect.js
  - /js/asteroids.js
